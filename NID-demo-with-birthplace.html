<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="bn"><head>
  <meta charset="UTF-8">
  <title>Bangladesh NID Demo</title>
  <style>
    @font-face{font-family:'FreeSerif Bengali Embedded';src:url('fonts/FreeSerif-Bengali.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'FreeSerif Bengali Embedded';src:url('fonts/FreeSerif-Bengali-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #e9e9e9;
      font-family: "FreeSerif Bengali Embedded", "SolaimanLipi", "Noto Sans Bengali", "Arial", sans-serif;
    }

    .nid-card {
      position: relative;
      width: min(1300px, 92vw);
      aspect-ratio: 2183 / 753;
      background: url("nid-card.jpg.jpg.jpg") no-repeat center center;
      background-size: contain;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
    }

    .text-block {
      position: absolute;
      font-family: "FreeSerif Bengali Embedded", "SolaimanLipi", "Noto Sans Bengali", "Arial", sans-serif;
      color: #000;
      line-height: 1.2;
      white-space: nowrap;
      z-index: 2;
    }

    .field-name-bn {
      top: 33%;
      left: 13%;
      font-size: clamp(16px, 1.6vw, 26px);
      font-weight: 700;
    }

    .field-name-en {
      top: 39%;
      left: 13%;
      font-size: clamp(15px, 1.2vw, 21px);
    }

    .field-father-bn {
      top: 46%;
      left: 13%;
      font-size: clamp(16px, 1.6vw, 26px);
      font-weight: 700;
    }

    .field-mother-bn {
      top: 53%;
      left: 13%;
      font-size: clamp(16px, 1.6vw, 26px);
      font-weight: 700;
    }

    .field-dob-en {
      top: 60%;
      left: 13%;
      font-size: clamp(15px, 1.25vw, 21px);
    }

    .field-id-en {
      top: 68%;
      left: 13%;
      font-size: clamp(15px, 1.25vw, 21px);
    }

    .field-address-bn {
      top: 15.5%;
      left: 54%;
      width: 31%;
      font-size: clamp(13px, 1.1vw, 19px);
      white-space: normal;
      line-height: 1.4;
    }

    .field-blood-en {
      top: 34%;
      left: 55%;
      font-size: clamp(13px, 1.15vw, 20px);
    }

    .field-issue-no-bn {
      top: 34%;
      right: 9%;
      left: auto;
      font-size: clamp(12px, 1vw, 17px);
    }

    .field-authority-sign {
      top: 60%;
      left: 63%;
      font-size: clamp(12px, 1vw, 18px);
    }

    .field-issue-date-bn {
      top: 60%;
      right: 6%;
      left: auto;
      font-size: clamp(12px, 1vw, 18px);
    }
  </style>
</head>
<body>

<div class="nid-card" style="position: absolute; left: -424px; top: 115px; font-size: 9px; width: 1300px; height: 446px; font-weight: 500;">
    <div class="text-block field-name-bn" style="position: absolute; left: 246px; top: 157px; font-size: 27px; width: 194px; height: 31px;">মোঃ জাহিদুল ইসলাম</div>
    <div class="text-block field-name-en" style="position: absolute; left: 249px; top: 209px; -webkit-text-stroke: 0.35px currentcolor; font-size: 24px; width: 163px; height: 25px;">MD. ZAHIDUL ISLAM</div>

    <div class="text-block field-father-bn" style="position: absolute; left: 244px; top: 247px; font-weight: 400; font-size: 23px; width: 167px; height: 31px;">মোঃ আব্দুল হাকিম</div>
    <div class="text-block field-mother-bn" style="position: absolute; left: 248px; top: 287px; font-weight: 200; font-size: 23px; width: 132px; height: 31px; -webkit-text-stroke: 0.4px currentcolor;">রোকেয়া বেগম</div>

    <div class="text-block field-dob-en" style="position: absolute; left: 313px; top: 326px; color: rgb(225, 29, 72); -webkit-text-stroke: 0.25px currentcolor;"> 15 Mar 1995</div>
    <div class="text-block field-id-en" style="position: absolute; left: 250px; top: 360px; color: rgb(225, 29, 72); -webkit-text-stroke: 0.45px currentcolor; font-weight: 600;">1995031500123456</div>

    <div class="text-block field-address-bn" style="position: absolute; left: 719px; top: 96px; font-size: 18px; width: 392px; height: 53px; font-weight: 500; -webkit-text-stroke: 0.15px currentcolor; opacity: 1;">
    গ্রাম: দক্ষিণপাড়া, ডাকঘর: শ্যামপুর, উপজেলা: মিরপুর, জেলা: ঢাকা।
    </div>

    <div class="text-block field-birth-place" data-field="birthPlace" style="font-family:SolaimanLipi, Noto Sans Bengali, Arial, sans-serif;font-weight:500;position:absolute;left:719px;top:160px;font-size:18px;min-width:90px;min-height:24px"></div>
    <div class="text-block field-blood-en" style="position: absolute; left: 855px; top: 200px; font-size: 16px; width: 25px; height: 24px;"> B+</div>
    <div class="text-block field-issue-date-bn" style="position: absolute; left: 1095px; top: 277px; -webkit-text-stroke: 0.15px currentcolor;">২০-০৮-২০২৪</div>
  </div>


<div data-new-editor-text="true" style="position: absolute; left: 70px; top: 54px; font-family: "SolaimanLipi", "Noto Sans Bengali", Arial, sans-serif; font-size: 20px; font-weight: 400; -webkit-text-stroke: 0px transparent; text-shadow: none; opacity: 1; color: rgb(0, 0, 0); white-space: pre-wrap; cursor: move;"></div></body></html>
