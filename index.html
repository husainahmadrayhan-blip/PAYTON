function collectStageStyles(){
 let css='';
 // Copy screen styles needed by the certificate, but skip editor-level @media print
 // rules. Those rules target the editor layout and were causing extra blank pages.
 const appendRules=(rules)=>{
   for(const rule of [...rules]){
     if(rule.type===CSSRule.MEDIA_RULE){
       if(/print/i.test(rule.conditionText||rule.media?.mediaText||'')) continue;
       try{css += rule.cssText+'\n'}catch(e){}
     }else{
       try{css += rule.cssText+'\n'}catch(e){}
     }
   }
 };
 for(const sheet of [...document.styleSheets]){
   try{appendRules(sheet.cssRules)}catch(e){}
 }
 return css;
}
function stageDimensions(){
 const r=stage.getBoundingClientRect();
 // Include overflow content, not only the fixed editor canvas size.
 const w=Math.max(parseFloat(stage.style.width)||0,stage.scrollWidth||0,r.width||0,1);
 const h=Math.max(parseFloat(stage.style.height)||0,stage.scrollHeight||0,r.height||0,1);
 return {w,h};
}
$('printPdf').onclick=()=>{
 if(!doc && !stage.querySelector('*')){alert('আগে HTML/ZIP প্রজেক্ট লোড করুন');return}
 let pw=null;
 try{
   pw=window.open('', '_blank');
   if(!pw){alert('Print window blocked. Chrome-এর address bar-এর পাশে Pop-ups অনুমতি দিন, তারপর Print / PDF চাপুন।');return}
   const rect=stage.getBoundingClientRect();
   const stageW=Math.max(parseFloat(getComputedStyle(stage).width)||parseFloat(stage.style.width)||stage.scrollWidth||1,1);
   const stageH=Math.max(parseFloat(getComputedStyle(stage).height)||parseFloat(stage.style.height)||stage.scrollHeight||1,1);
   // Print the entire stage, not a crop computed from viewport rectangles.
   // getBoundingClientRect() is viewport/scroll/zoom dependent; using those
   // coordinates for the crop caused the top/side of the card to be clipped.
   const minX=0, minY=0;
   const cropW=Math.max(1,Math.ceil(stageW));
   const cropH=Math.max(1,Math.ceil(stageH));
   // One page uses the stage's full dimensions at 96 CSS px per inch.
   const fitScale=1;
   const pageWmm=Math.max(1,cropW*25.4/96), pageHmm=Math.max(1,cropH*25.4/96);
   const a4Wpx=cropW, a4Hpx=cropH;
   const offsetX=0, offsetY=0;
   const clone=stage.cloneNode(true);
   // Freeze typography from the live HTML preview before opening the print window.
   // This prevents responsive @media rules (triggered when DevTools narrows the
   // browser viewport) from shrinking text in the print document.
   const sourceTypography=[stage,...stage.querySelectorAll('*')];
   const cloneTypography=[clone,...clone.querySelectorAll('*')];
   sourceTypography.forEach((sourceEl,i)=>{
     const target=cloneTypography[i];
     if(!target || !target.style) return;
     const cs=getComputedStyle(sourceEl);
     ['font-size','font-family','font-weight','font-style','line-height',
      'letter-spacing','word-spacing','text-transform','text-indent',
      '-webkit-text-size-adjust','text-size-adjust'].forEach(prop=>{
        const value=cs.getPropertyValue(prop);
        if(value) target.style.setProperty(prop,value,'important');
     });
   });
   // Print-only typography repair: the DOB, NID number and issue-date values
   // were inheriting smaller per-field font sizes. Keep the editor unchanged.
   // Match the smallest element containing each label/value and normalize its
   // font size only when it is clearly a target field.
   // Keep all text styles exactly as they are in the HTML preview.
   // No print-only font-size overrides are applied.
   // Shift the complete stage by the measured content bounds, then scale once.
   // Use setProperty so existing inline styles cannot silently override it.
   clone.style.setProperty('position','absolute','important');
   clone.style.setProperty('left','0px','important');
   clone.style.setProperty('top','0px','important');
   clone.style.setProperty('width',stageW+'px','important');
   clone.style.setProperty('height',stageH+'px','important');
   clone.style.setProperty('margin','0','important');
   clone.style.setProperty('transform','scale('+fitScale+')','important');
   clone.style.setProperty('transform-origin','top left','important');
   clone.style.setProperty('box-shadow','none','important');
   clone.style.setProperty('background','#fff','important');
   clone.style.setProperty('overflow','visible','important');
   clone.querySelectorAll('.selected,.editable.selected,[data-editor-ui],.resize-handle,.selection-box,.drag-handle,.editor-only').forEach(el=>el.remove());
   const css=collectStageStyles().replace(/@page[^{}]*\{[^}]*\}/gi,'');
   pw.document.open();
   pw.document.write('<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NID PDF</title><style>@page{size:'+pageWmm+'mm '+pageHmm+'mm;margin:0}*{box-sizing:border-box}html,body{margin:0!important;padding:0!important;width:'+a4Wpx+'px!important;height:'+a4Hpx+'px!important;min-width:'+a4Wpx+'px!important;min-height:'+a4Hpx+'px!important;max-width:'+a4Wpx+'px!important;max-height:'+a4Hpx+'px!important;overflow:visible!important;background:#fff!important;color:#000!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}#print-root{position:relative!important;display:block!important;width:'+a4Wpx+'px!important;height:'+a4Hpx+'px!important;min-width:'+a4Wpx+'px!important;min-height:'+a4Hpx+'px!important;max-width:'+a4Wpx+'px!important;max-height:'+a4Hpx+'px!important;margin:0!important;padding:0!important;overflow:visible!important;background:#fff!important;break-inside:avoid!important;page-break-inside:avoid!important;break-after:avoid-page!important;page-break-after:avoid!important}#stage{position:absolute!important;left:0!important;top:0!important;transform:none!important;box-shadow:none!important;background:#fff!important;overflow:visible!important}.selected,.editable.selected{outline:none!important}@media screen{body{padding:12px!important;width:auto!important;height:auto!important}#print-root{outline:1px solid #bbb}}@media print{html,body,#print-root{margin:0!important;padding:0!important;overflow:visible!important;break-before:avoid!important;break-after:avoid!important;page-break-before:avoid!important;page-break-after:avoid!important}}</style><style>'+css.replace(/<\/style/gi,'<\\/style')+'</style><style>/* Do not override the content-sized @page declared above. A second A4 rule here caused Chrome to repaginate/scale the print output. */html,body,#print-root{margin:0!important;padding:0!important;background:#fff!important;box-shadow:none!important;break-before:avoid!important;break-after:avoid!important;page-break-before:avoid!important;page-break-after:avoid!important}#stage,#print-root,#print-root *{box-shadow:none!important}#stage{background:#fff!important} #print-root{break-inside:avoid!important;page-break-inside:avoid!important;overflow:visible!important}body{break-after:avoid!important;page-break-after:avoid!important}@media print{@page{size:'+pageWmm+'mm '+pageHmm+'mm;margin:0!important}html,body{break-before:avoid!important;break-after:avoid!important;page-break-before:avoid!important;page-break-after:avoid!important}#print-root{position:relative!important;overflow:hidden!important;break-inside:avoid!important;page-break-inside:avoid!important}}</style></head><body><div id="print-root" style="width:'+a4Wpx+'px;height:'+a4Hpx+'px">'+clone.outerHTML+'</div></body></html>');
   pw.document.close();
   const doPrint=()=>{try{const ready=()=>{try{pw.focus();pw.print()}catch(e){alert('PDF Print চালু করা যায়নি: '+e.message)}};const fonts=pw.document.fonts&&pw.document.fonts.ready?pw.document.fonts.ready:Promise.resolve();Promise.all([fonts,...Array.from(pw.document.images||[]).map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=img.onerror=resolve}))]).then(()=>setTimeout(ready,180));}catch(e){alert('PDF Print চালু করা যায়নি: '+e.message)}};
   if(pw.document.readyState==='complete')setTimeout(doPrint,100);else pw.addEventListener('load',()=>setTimeout(doPrint,100),{once:true});
 }catch(e){try{pw&&pw.close()}catch(_){} alert('PDF তৈরি করা যায়নি: '+e.message)}
};
$('downloadImage').onclick=async()=>{
 if(!doc && !stage.querySelector('*')){alert('আগে HTML/ZIP প্রজেক্ট লোড করুন');return}
 try{
   const {w,h}=stageDimensions(),scale=2;
   const clone=stage.cloneNode(true);
   clone.querySelectorAll('.selected,.editable.selected').forEach(el=>{el.classList.remove('selected');el.style.outline='none'});
   clone.style.transform='none';clone.style.margin='0';clone.style.width=w+'px';clone.style.height=h+'px';
   const styles=collectStageStyles();
   const svgDoc=document.implementation.createDocument('http://www.w3.org/2000/svg','svg',null);
   const svg=svgDoc.documentElement;
   svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
   svg.setAttribute('width',String(Math.ceil(w*scale)));svg.setAttribute('height',String(Math.ceil(h*scale)));
   svg.setAttribute('viewBox','0 0 '+w+' '+h);
   const fo=svgDoc.createElementNS('http://www.w3.org/2000/svg','foreignObject');
   fo.setAttribute('width','100%');fo.setAttribute('height','100%');
   const div=svgDoc.createElementNS('http://www.w3.org/1999/xhtml','div');
   div.setAttribute('xmlns','http://www.w3.org/1999/xhtml');
   const style=svgDoc.createElementNS('http://www.w3.org/1999/xhtml','style');style.textContent=styles;
   div.appendChild(style);
   const holder=svgDoc.createElementNS('http://www.w3.org/1999/xhtml','div');
   holder.innerHTML=clone.outerHTML;
   while(holder.firstChild)div.appendChild(svgDoc.importNode(holder.firstChild,true));
   fo.appendChild(div);svg.appendChild(fo);
   const serialized=new XMLSerializer().serializeToString(svg);
   const blob=new Blob([serialized],{type:'image/svg+xml;charset=utf-8'});
   const url=URL.createObjectURL(blob),img=new Image();
   img.onload=()=>{
     try{
       const canvas=document.createElement('canvas');canvas.width=Math.ceil(w*scale);canvas.height=Math.ceil(h*scale);
       const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
       canvas.toBlob(png=>{
         if(!png){alert('PNG তৈরি হয়নি। Print / PDF ব্যবহার করুন।');URL.revokeObjectURL(url);return}
         const a=document.createElement('a');const pngUrl=URL.createObjectURL(png);a.href=pngUrl;a.download='html-preview.png';document.body.appendChild(a);a.click();a.remove();
         setTimeout(()=>URL.revokeObjectURL(pngUrl),15000);URL.revokeObjectURL(url);status('PNG image downloaded');
       },'image/png');
     }catch(err){URL.revokeObjectURL(url);alert('ছবি তৈরি করা যায়নি: '+err.message)}
   };
   img.onerror=()=>{URL.revokeObjectURL(url);alert('এই HTML-এর কিছু ইমেজ/ফন্ট PNG export-এ সমর্থিত হয়নি। Print / PDF ব্যবহার করুন।')};
   img.src=url;
 }catch(err){alert('ইমেজ ডাউনলোড ব্যর্থ: '+err.message)}
};
